<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Moovie</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e1e; }
  #screen { display: block; width: 100vw; height: 100vh; outline: none; touch-action: none; }
  /* Out of sight but still a field the browser will copy from and paste into. Not hidden and not
     moved off the page: neither can hold the focus, and a field off the page is scrolled to. */
  #clipboard {
    position: fixed; top: 0; left: 0; width: 1px; height: 1px;
    opacity: 0; border: 0; padding: 0; resize: none; pointer-events: none;
  }
  #status {
    position: fixed; inset: auto 0 0 0; padding: 6px 10px; font: 13px system-ui, sans-serif;
    background: #b3261e; color: #fff; display: none;
  }
</style>
</head>
<body>
<canvas id="screen" tabindex="0"></canvas>
<textarea id="clipboard" tabindex="-1" aria-hidden="true" autocomplete="off" spellcheck="false"></textarea>
<div id="status"></div>
<script>
(() => {
  const canvas = document.getElementById('screen');
  const clipboard = document.getElementById('clipboard');
  const status = document.getElementById('status');
  const ctx = canvas.getContext('2d');
  let socket = null;

  const show = text => { status.textContent = text; status.style.display = text ? 'block' : 'none'; };
  const send = message => { if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(message)); };

  const modifiers = e => ({ alt: e.altKey, control: e.ctrlKey, shift: e.shiftKey, meta: e.metaKey });

  // Avalonia lays out in logical pixels and scales by the DPI it is told, so the viewport goes
  // over in CSS pixels with the device pixel ratio as the DPI. Frames then come back at the
  // physical size, which is what keeps text sharp on a HiDPI screen.
  const sendSize = () => send({
    type: 'size',
    width: canvas.clientWidth,
    height: canvas.clientHeight,
    dpi: 96 * (window.devicePixelRatio || 1),
  });

  // Script may only put text on the browser's clipboard from inside a gesture it has just handled
  // or over a secure connection, which a page served from a NAS over plain HTTP is not. So the
  // app's selected text is kept selected in the hidden field above, and that field holds the
  // focus: the browser's own copy and cut then have the right text to take, with nothing asked of
  // it. Keys are read from the window, so the app still sees every one of them.
  let selected = '';

  // Leaves the field in the state the browser's own copy and cut need to find it in.
  const prime = () => {
    clipboard.value = selected;
    // Not select(), which in some browsers moves the focus as well.
    clipboard.setSelectionRange(0, selected.length);
  };

  const mirror = text => { selected = text; prime(); };

  // What the browser is believed to hold, so the app does not chase its own copy with a second,
  // far less certain, attempt to put the same text there.
  let onClipboard = '';

  // A focused field raises the on-screen keyboard on a touch device, over the window it would be
  // typing into, so there the canvas keeps the focus and the clipboard is left to the browser's
  // own long-press menu.
  let physicalKeyboard = matchMedia('(pointer: fine)').matches;
  const focusApp = () => (physicalKeyboard ? clipboard : canvas).focus();

  // Which buttons are held goes over with every pointer message, not only the press, as the
  // browser's bitmask: 1 left, 2 right, 4 middle. A text box will not extend its selection unless
  // a move says the left button is down, so without this a drag across text selected nothing.
  const pointerAt = (e, type) => {
    const box = canvas.getBoundingClientRect();
    return {
      type, x: e.clientX - box.left, y: e.clientY - box.top,
      button: e.button, buttons: e.buttons, ...modifiers(e),
    };
  };

  // A mouse reports far more moves than a window can be redrawn for, and every one of them costs
  // a round trip and possibly a repaint. Only the latest is kept, and it goes out once a frame.
  let pendingMove = null;
  canvas.addEventListener('pointermove', e => {
    const wasIdle = pendingMove === null;
    pendingMove = pointerAt(e, 'pointer-moved');
    if (wasIdle) requestAnimationFrame(() => { if (pendingMove) { send(pendingMove); pendingMove = null; } });
  });
  canvas.addEventListener('pointerdown', e => {
    physicalKeyboard = e.pointerType !== 'touch';
    focusApp();
    canvas.setPointerCapture(e.pointerId);
    send(pointerAt(e, 'pointer-pressed'));
  });
  canvas.addEventListener('pointerup', e => {
    canvas.releasePointerCapture(e.pointerId);
    // A move still waiting for its frame happened before the release and has to go out first.
    if (pendingMove) { send(pendingMove); pendingMove = null; }
    send(pointerAt(e, 'pointer-released'));
  });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  // A mousedown focuses what is under the cursor, and the canvas is focusable so a touch device
  // has somewhere to put the focus. Left alone, every click took the focus off the hidden field
  // and the browser had nothing to copy from. Pointer events are unaffected, and so is the app.
  canvas.addEventListener('mousedown', e => e.preventDefault());

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const box = canvas.getBoundingClientRect();
    // Avalonia counts scroll in lines and a browser reports pixels unless the device is
    // line-wise, so a pixel delta is divided down to something that scrolls at a sane speed.
    const scale = e.deltaMode === 0 ? 1 / 40 : 1;
    send({
      type: 'scroll', x: e.clientX - box.left, y: e.clientY - box.top,
      deltaX: -e.deltaX * scale, deltaY: -e.deltaY * scale, ...modifiers(e),
    });
  }, { passive: false });

  // A printable character is sent as text as well as a key: Avalonia fills a text box from text
  // input events and uses key events only for editing and shortcuts. Control or Meta makes it a
  // shortcut rather than typing, so that goes as a key alone.
  const isTyping = e => e.key.length === 1 && !e.ctrlKey && !e.metaKey;

  // Which of the three the user asked for, under any of their spellings, or nothing.
  const clipboardAction = e => {
    const command = (e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey;
    const letter = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (command && (letter === 'c' || letter === 'x' || letter === 'v'))
      return { c: 'copy', x: 'cut', v: 'paste' }[letter];
    if (e.key === 'Insert' && !e.altKey) return e.ctrlKey ? 'copy' : e.shiftKey ? 'paste' : null;
    if (e.key === 'Delete' && e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) return 'cut';
    return null;
  };

  window.addEventListener('keydown', e => {
    // These three are the browser's to carry out on the hidden field, so they must not be
    // prevented the way everything below is. A paste comes back as a paste event; the other two
    // only have to be told to the app, which has the selection to cut and the text to remember.
    const clipboardKey = clipboardAction(e);
    if (clipboardKey) {
      // A key event is proof of a real keyboard, so the focus goes to the field whatever the last
      // pointer was, and the selection may have been pushed while something else held it.
      prime();
      clipboard.focus();

      if (clipboardKey !== 'paste') send({ type: clipboardKey });
      return;
    }

    // Tab would move focus out of the app and the browser's own shortcuts would shadow the
    // app's, so everything except the reload keys is claimed here.
    if (e.key !== 'F5' && !(e.ctrlKey && e.key === 'r')) e.preventDefault();

    send({ type: 'key', down: true, code: e.code, key: e.key, ...modifiers(e) });
    if (isTyping(e)) send({ type: 'text', text: e.key });
  });

  window.addEventListener('keyup', e => {
    if (clipboardAction(e)) return;
    send({ type: 'key', down: false, code: e.code, key: e.key, ...modifiers(e) });
  });

  window.addEventListener('paste', e => {
    e.preventDefault();
    const text = e.clipboardData?.getData('text');
    if (text) { onClipboard = text; send({ type: 'paste', text }); }
  });

  // The browser is taking the app's selection. Handed over explicitly rather than left to the
  // field's own selection; a cut deletes nothing here, since the app deletes its own selection
  // and then pushes what is left.
  const take = e => {
    if (!selected) return;

    // A browser without clipboardData would throw harmlessly: its own copy of the field would
    // then take the same text.
    e.clipboardData.setData('text/plain', selected);
    e.preventDefault();
    onClipboard = selected;
  };
  window.addEventListener('copy', take);
  window.addEventListener('cut', take);

  // The app copied from its own context menu rather than the user pressing anything. Chrome
  // allows this for a few seconds after the click that asked for it, Firefox only from inside the
  // gesture's own handler, so it is attempted rather than relied on: the field holds the text
  // either way, and the user's own Ctrl+C always works.
  const offerCopy = text => {
    mirror(text);
    if (!text || text === onClipboard || !physicalKeyboard) return;
    clipboard.focus();
    try { document.execCommand('copy'); } catch { /* not allowed here, and nothing is lost */ }
  };

  const control = message => {
    if (message.type === 'selection') mirror(message.text);
    else if (message.type === 'copied') offerCopy(message.text);
  };

  window.addEventListener('resize', sendSize);

  // Each message is a patch: the size of the whole window, where the patch belongs in it, and a
  // PNG of that part. Decoding is asynchronous, so draws are chained rather than raced: two
  // patches applied out of order would leave the window showing something that never was.
  let drawing = Promise.resolve();

  const draw = async data => {
    const header = new DataView(data);
    const frameWidth = header.getInt32(0, true);
    const frameHeight = header.getInt32(4, true);
    const count = header.getInt32(8, true);

    const patches = [];
    let at = 12;
    for (let i = 0; i < count; i++) {
      const x = header.getInt32(at, true);
      const y = header.getInt32(at + 4, true);
      const length = header.getInt32(at + 8, true);
      patches.push({ x, y, blob: new Blob([data.slice(at + 12, at + 12 + length)], { type: 'image/png' }) });
      at += 12 + length;
    }

    const bitmaps = await Promise.all(patches.map(p => createImageBitmap(p.blob)));

    // Assigning either dimension clears the canvas, so it is only done when the size really
    // changed, after which the server sends the whole window rather than a patch of it.
    if (canvas.width !== frameWidth || canvas.height !== frameHeight) {
      canvas.width = frameWidth;
      canvas.height = frameHeight;
    }

    bitmaps.forEach((bitmap, i) => {
      ctx.drawImage(bitmap, patches[i].x, patches[i].y);
      bitmap.close();
    });
  };

  const connect = () => {
    socket = new WebSocket((location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/ws');
    socket.binaryType = 'arraybuffer';
    socket.onopen = () => { show(''); sendSize(); focusApp(); };
    // Frames are binary and everything the app has to say about the clipboard is text.
    socket.onmessage = e => {
      if (typeof e.data === 'string') control(JSON.parse(e.data));
      else drawing = drawing.then(() => draw(e.data)).catch(() => {});
    };
    socket.onclose = () => { show('Disconnected: reconnecting…'); setTimeout(connect, 1000); };
    socket.onerror = () => socket.close();
  };

  connect();
})();
</script>
</body>
</html>
