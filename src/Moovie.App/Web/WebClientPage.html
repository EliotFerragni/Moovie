<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Moovie</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e1e; overscroll-behavior: none; }
  /* Sized from script rather than in vh: on a phone or tablet those units count the space the
     browser's own toolbars sit over, which put the app's footer off the bottom of the screen. */
  #screen {
    position: fixed; top: 0; left: 0; display: block; width: 100vw; height: 100vh; outline: none;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  /* Out of sight but still a field the browser will copy from and paste into. Not hidden and not
     moved off the page: neither can hold the focus, and a field off the page is scrolled to. */
  #clipboard {
    position: fixed; top: 0; left: 0; width: 1px; height: 1px;
    opacity: 0; border: 0; padding: 0; resize: none; pointer-events: none;
  }
  #keyboard {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); display: none;
    padding: 9px 16px; border: 0; border-radius: 999px; font: 15px system-ui, sans-serif;
    background: #3d5a80; color: #fff; box-shadow: 0 2px 8px #0006;
  }
  #status {
    position: fixed; inset: auto 0 0 0; padding: 6px 10px; font: 13px system-ui, sans-serif;
    background: #b3261e; color: #fff; display: none;
  }
</style>
</head>
<body>
<canvas id="screen" tabindex="0"></canvas>
<textarea id="clipboard" tabindex="-1" aria-hidden="true" autocomplete="off" spellcheck="false"
          autocapitalize="off" autocorrect="off"></textarea>
<button id="keyboard" type="button">⌨ Keyboard</button>
<div id="status"></div>
<script>
(() => {
  const canvas = document.getElementById('screen');
  const clipboard = document.getElementById('clipboard');
  const keyboard = document.getElementById('keyboard');
  const status = document.getElementById('status');
  const ctx = canvas.getContext('2d');
  let socket = null;

  const show = text => { status.textContent = text; status.style.display = text ? 'block' : 'none'; };
  const send = message => { if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(message)); };

  const modifiers = e => ({ alt: e.altKey, control: e.ctrlKey, shift: e.shiftKey, meta: e.metaKey });

  // Avalonia counts scroll in lines and a browser reports pixels unless the device is line-wise,
  // so a pixel distance is divided down to something that scrolls at a sane speed. A finger is
  // scaled the same way, which keeps dragging and the wheel at one speed.
  const linesPerPixel = 1 / 40;

  // Avalonia lays out in logical pixels and scales by the DPI it is told, so the viewport goes
  // over in CSS pixels with the device pixel ratio as the DPI. Frames then come back at the
  // physical size, which is what keeps text sharp on a HiDPI screen.
  //
  // The measurement is the visual viewport, not the window: a browser's toolbars and an on-screen
  // keyboard are outside it, so the app is given exactly the area the user can see and lays its
  // footer out at the bottom of that.
  const viewport = window.visualViewport;

  const sendSize = () => {
    const width = Math.round(viewport ? viewport.width : window.innerWidth);
    const height = Math.round(viewport ? viewport.height : window.innerHeight);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    send({ type: 'size', width, height, dpi: 96 * (window.devicePixelRatio || 1) });
  };

  // A keyboard sliding in or out reports its size the whole way, and every one of those relaid out
  // the app and redrew the whole window, so only where it comes to rest is acted on.
  let settling = 0;
  const resized = () => { clearTimeout(settling); settling = setTimeout(sendSize, 120); };

  // Script may only put text on the browser's clipboard from inside a gesture it has just handled
  // or over a secure connection, which a page served from a NAS over plain HTTP is not. So the
  // app's selected text is kept selected in the hidden field above, and that field holds the
  // focus: the browser's own copy and cut then have the right text to take, with nothing asked of
  // it. Keys are read from the window, so the app still sees every one of them.
  let selected = '';

  // Leaves the field in the state the browser's own copy and cut need to find it in.
  const prime = () => {
    clipboard.value = selected;
    // Not select(), which in some browsers moves the focus as well.
    clipboard.setSelectionRange(0, selected.length);
  };

  const mirror = text => { selected = text; prime(); };

  // What the browser is believed to hold, so the app does not chase its own copy with a second,
  // far less certain, attempt to put the same text there.
  let onClipboard = '';

  // A focused field raises the on-screen keyboard on a touch device, over the window it would be
  // typing into, so there the canvas keeps the focus and the clipboard is left to the browser's
  // own long-press menu, until the user asks for the keyboard through the button below.
  let physicalKeyboard = matchMedia('(pointer: fine)').matches;
  const focusApp = () => (physicalKeyboard || keyboardUp ? clipboard : canvas).focus();

  // A browser raises its on-screen keyboard only for a field of its own that has just been focused
  // from a gesture the browser itself handled. The app's fields are pictures, and word that one of
  // them has the focus comes back from the server long after the tap that focused it, far too late
  // to count as that gesture. So the page asks instead: while the app is somewhere the user can
  // type and the keyboard is down, the button offers it, and pressing the button is a gesture.
  let textFocused = false;
  let keyboardUp = false;

  const offerKeyboard = () =>
    keyboard.style.display = !physicalKeyboard && textFocused && !keyboardUp ? 'block' : 'none';

  const showKeyboard = () => {
    keyboardUp = true;
    prime();
    clipboard.focus();
    offerKeyboard();
  };

  const hideKeyboard = () => {
    keyboardUp = false;
    canvas.focus();
    offerKeyboard();
  };

  // On pointerdown rather than click: the default of a press on a button is to focus it, which
  // would take the focus straight back off the field the press is there to focus.
  keyboard.addEventListener('pointerdown', e => { e.preventDefault(); showKeyboard(); });

  // The keyboard's own dismiss key only takes the focus off the field, and says nothing else, so
  // the offer is put back from the blur.
  clipboard.addEventListener('blur', () => { if (keyboardUp) { keyboardUp = false; offerKeyboard(); } });

  const textFocus = active => {
    textFocused = active;
    // Nothing left to type into. Putting a keyboard away needs no gesture, so that is done here.
    if (!active && keyboardUp) hideKeyboard();
    else offerKeyboard();
  };

  // Which buttons are held goes over with every pointer message, not only the press, as the
  // browser's bitmask: 1 left, 2 right, 4 middle. A text box will not extend its selection unless
  // a move says the left button is down, so without this a drag across text selected nothing.
  const pointerAt = (e, type, clientX = e.clientX, clientY = e.clientY) => {
    const box = canvas.getBoundingClientRect();
    return {
      type, x: clientX - box.left, y: clientY - box.top,
      button: e.button, buttons: e.buttons, ...modifiers(e),
    };
  };

  // A mouse reports far more moves than a window can be redrawn for, and every one of them costs
  // a round trip and possibly a repaint. Only the latest is kept, and it goes out once a frame.
  let pendingMove = null;
  const flushMove = () => { if (pendingMove) { send(pendingMove); pendingMove = null; } };
  const queueMove = e => {
    const wasIdle = pendingMove === null;
    pendingMove = pointerAt(e, 'pointer-moved');
    if (wasIdle) requestAnimationFrame(flushMove);
  };

  // Scrolling by hand is coalesced the same way, and by distance rather than by position: the
  // finger may travel a long way between two frames and none of it should be lost.
  let pendingPan = null;
  const flushPan = () => { if (pendingPan) { send(pendingPan); pendingPan = null; } };
  const panBy = (e, dx, dy) => {
    const box = canvas.getBoundingClientRect();
    if (!pendingPan) {
      pendingPan = { type: 'scroll', x: 0, y: 0, deltaX: 0, deltaY: 0, ...modifiers(e) };
      requestAnimationFrame(flushPan);
    }

    pendingPan.x = e.clientX - box.left;
    pendingPan.y = e.clientY - box.top;
    pendingPan.deltaX += dx * linesPerPixel;
    pendingPan.deltaY += dy * linesPerPixel;
  };

  // A finger has to say which of three things it means, since the app was written for a mouse and
  // the browser's own scrolling is turned off over the canvas. A tap is a click. A drag scrolls
  // what is under it, the way it would anywhere else on a touch device. A finger held still first
  // presses and then drags in the app, which is what selects text and moves a scroll bar's thumb.
  const dragSlop = 10;
  const holdMs = 450;
  let finger = null;

  // A double tap is two presses to the app, and the app counts a second press as the same click
  // only where a mouse would have stayed: within a couple of pixels. A finger never lands twice in
  // the same place, so nothing that wants a double click could be reached at all, a folder in the
  // file browser among them. A tap that follows hard on the last one is therefore sent from
  // exactly where that one was, which is what makes the two a pair.
  const doubleSlop = 20;
  const doubleMs = 350;
  let lastTap = null;

  const startFinger = e => {
    const paired = lastTap !== null && e.timeStamp - lastTap.at < doubleMs
      && Math.abs(e.clientX - lastTap.x) < doubleSlop && Math.abs(e.clientY - lastTap.y) < doubleSlop;
    const tapX = paired ? lastTap.x : e.clientX;
    const tapY = paired ? lastTap.y : e.clientY;

    const started = {
      id: e.pointerId, x: e.clientX, y: e.clientY, tapX, tapY, mode: 'tap',
      pressed: pointerAt(e, 'pointer-pressed', tapX, tapY),
    };
    started.hold = setTimeout(() => { started.mode = 'drag'; send(started.pressed); }, holdMs);
    finger = started;
  };

  const moveFinger = e => {
    if (finger.mode === 'drag') { queueMove(e); return; }

    if (finger.mode === 'pan') panBy(e, e.clientX - finger.x, e.clientY - finger.y);
    else if (Math.abs(e.clientX - finger.x) > dragSlop || Math.abs(e.clientY - finger.y) > dragSlop) {
      // The slop itself is not scrolled: the content follows the finger from where it is now.
      clearTimeout(finger.hold);
      finger.mode = 'pan';
    } else return;

    finger.x = e.clientX;
    finger.y = e.clientY;
  };

  const endFinger = (e, cancelled) => {
    clearTimeout(finger.hold);
    const { mode, pressed, tapX, tapY } = finger;
    finger = null;

    if (mode === 'pan') { flushPan(); return; }
    if (mode === 'drag') { flushMove(); send(pointerAt(e, 'pointer-released')); return; }
    if (cancelled) return;

    // A tap is the press the hold was still waiting on, with its release straight after. The press
    // is the one built when the finger landed, which is the only one saying a button is down, and
    // the release goes to the same point so that the app sees one click rather than a tiny drag.
    send(pressed);
    send(pointerAt(e, 'pointer-released', tapX, tapY));
    lastTap = { x: tapX, y: tapY, at: e.timeStamp };
  };

  canvas.addEventListener('pointermove', e => {
    if (finger) { if (e.pointerId === finger.id) moveFinger(e); return; }
    if (e.pointerType !== 'touch') queueMove(e);
  });
  canvas.addEventListener('pointerdown', e => {
    physicalKeyboard = e.pointerType !== 'touch';
    offerKeyboard();
    focusApp();
    canvas.setPointerCapture(e.pointerId);

    if (e.pointerType !== 'touch') send(pointerAt(e, 'pointer-pressed'));
    // A second finger is ignored rather than left to fight the first over what the gesture is.
    else if (!finger) startFinger(e);
  });
  canvas.addEventListener('pointerup', e => {
    canvas.releasePointerCapture(e.pointerId);
    if (finger) { if (e.pointerId === finger.id) endFinger(e, false); return; }
    if (e.pointerType === 'touch') return;

    // A move still waiting for its frame happened before the release and has to go out first.
    flushMove();
    send(pointerAt(e, 'pointer-released'));
  });
  canvas.addEventListener('pointercancel', e => {
    if (finger && e.pointerId === finger.id) endFinger(e, true);
  });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  // A mousedown focuses what is under the cursor, and the canvas is focusable so a touch device
  // has somewhere to put the focus. Left alone, every click took the focus off the hidden field
  // and the browser had nothing to copy from. Pointer events are unaffected, and so is the app.
  canvas.addEventListener('mousedown', e => e.preventDefault());

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const box = canvas.getBoundingClientRect();
    const scale = e.deltaMode === 0 ? linesPerPixel : 1;
    send({
      type: 'scroll', x: e.clientX - box.left, y: e.clientY - box.top,
      deltaX: -e.deltaX * scale, deltaY: -e.deltaY * scale, ...modifiers(e),
    });
  }, { passive: false });

  // A printable character is sent as text as well as a key: Avalonia fills a text box from text
  // input events and uses key events only for editing and shortcuts. Control or Meta makes it a
  // shortcut rather than typing, so that goes as a key alone.
  const isTyping = e => e.key.length === 1 && !e.ctrlKey && !e.metaKey;

  // Which of the three the user asked for, under any of their spellings, or nothing.
  const clipboardAction = e => {
    const command = (e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey;
    const letter = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (command && (letter === 'c' || letter === 'x' || letter === 'v'))
      return { c: 'copy', x: 'cut', v: 'paste' }[letter];
    if (e.key === 'Insert' && !e.altKey) return e.ctrlKey ? 'copy' : e.shiftKey ? 'paste' : null;
    if (e.key === 'Delete' && e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) return 'cut';
    return null;
  };

  window.addEventListener('keydown', e => {
    // A key named after a place on a keyboard came from one, and a tablet with one attached has no
    // use for the on-screen keyboard's button. An on-screen key carries no such name.
    if (e.code && !keyboardUp && !physicalKeyboard) { physicalKeyboard = true; offerKeyboard(); }

    // These three are the browser's to carry out on the hidden field, so they must not be
    // prevented the way everything below is. A paste comes back as a paste event; the other two
    // only have to be told to the app, which has the selection to cut and the text to remember.
    const clipboardKey = clipboardAction(e);
    if (clipboardKey) {
      // A key event is proof of a real keyboard, so the focus goes to the field whatever the last
      // pointer was, and the selection may have been pushed while something else held it.
      prime();
      clipboard.focus();

      if (clipboardKey !== 'paste') send({ type: clipboardKey });
      return;
    }

    // Tab would move focus out of the app and the browser's own shortcuts would shadow the
    // app's, so everything except the reload keys is claimed here.
    if (e.key !== 'F5' && !(e.ctrlKey && e.key === 'r')) e.preventDefault();

    send({ type: 'key', down: true, code: e.code, key: e.key, ...modifiers(e) });
    if (isTyping(e)) send({ type: 'text', text: e.key });
  });

  window.addEventListener('keyup', e => {
    if (clipboardAction(e)) return;
    send({ type: 'key', down: false, code: e.code, key: e.key, ...modifiers(e) });
  });

  // Some on-screen keyboards, Android's in particular, will not say which key was pressed and
  // report only the edit they are making. Those edits are read off the hidden field as what the
  // user typed, and the field itself is never changed: the app holds the text, not the page.
  const tap = key => {
    const stroke = { type: 'key', code: key, key, alt: false, control: false, shift: false, meta: false };
    send({ ...stroke, down: true });
    send({ ...stroke, down: false });
  };

  clipboard.addEventListener('beforeinput', e => {
    e.preventDefault();
    if (e.inputType === 'deleteContentBackward') tap('Backspace');
    else if (e.inputType === 'deleteContentForward') tap('Delete');
    else if (e.inputType.startsWith('insertLineBreak') || e.inputType.startsWith('insertParagraph')) tap('Enter');
    else if (e.data) send({ type: 'text', text: e.data });
  });

  window.addEventListener('paste', e => {
    e.preventDefault();
    const text = e.clipboardData?.getData('text');
    if (text) { onClipboard = text; send({ type: 'paste', text }); }
  });

  // The browser is taking the app's selection. Handed over explicitly rather than left to the
  // field's own selection; a cut deletes nothing here, since the app deletes its own selection
  // and then pushes what is left.
  const take = e => {
    if (!selected) return;

    // A browser without clipboardData would throw harmlessly: its own copy of the field would
    // then take the same text.
    e.clipboardData.setData('text/plain', selected);
    e.preventDefault();
    onClipboard = selected;
  };
  window.addEventListener('copy', take);
  window.addEventListener('cut', take);

  // The app copied from its own context menu rather than the user pressing anything. Chrome
  // allows this for a few seconds after the click that asked for it, Firefox only from inside the
  // gesture's own handler, so it is attempted rather than relied on: the field holds the text
  // either way, and the user's own Ctrl+C always works.
  const offerCopy = text => {
    mirror(text);
    if (!text || text === onClipboard || !physicalKeyboard) return;
    clipboard.focus();
    try { document.execCommand('copy'); } catch { /* not allowed here, and nothing is lost */ }
  };

  const control = message => {
    if (message.type === 'selection') mirror(message.text);
    else if (message.type === 'copied') offerCopy(message.text);
    else if (message.type === 'text-focus') textFocus(message.active);
  };

  window.addEventListener('resize', resized);
  viewport?.addEventListener('resize', resized);

  // Each message is a patch: the size of the whole window, where the patch belongs in it, and a
  // PNG of that part. Decoding is asynchronous, so draws are chained rather than raced: two
  // patches applied out of order would leave the window showing something that never was.
  let drawing = Promise.resolve();

  const draw = async data => {
    const header = new DataView(data);
    const frameWidth = header.getInt32(0, true);
    const frameHeight = header.getInt32(4, true);
    const count = header.getInt32(8, true);

    const patches = [];
    let at = 12;
    for (let i = 0; i < count; i++) {
      const x = header.getInt32(at, true);
      const y = header.getInt32(at + 4, true);
      const length = header.getInt32(at + 8, true);
      patches.push({ x, y, blob: new Blob([data.slice(at + 12, at + 12 + length)], { type: 'image/png' }) });
      at += 12 + length;
    }

    const bitmaps = await Promise.all(patches.map(p => createImageBitmap(p.blob)));

    // Assigning either dimension clears the canvas, so it is only done when the size really
    // changed, after which the server sends the whole window rather than a patch of it.
    if (canvas.width !== frameWidth || canvas.height !== frameHeight) {
      canvas.width = frameWidth;
      canvas.height = frameHeight;
    }

    bitmaps.forEach((bitmap, i) => {
      ctx.drawImage(bitmap, patches[i].x, patches[i].y);
      bitmap.close();
    });
  };

  const connect = () => {
    socket = new WebSocket((location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/ws');
    socket.binaryType = 'arraybuffer';
    socket.onopen = () => { show(''); sendSize(); focusApp(); };
    // Frames are binary and everything the app has to say about the clipboard is text.
    socket.onmessage = e => {
      if (typeof e.data === 'string') control(JSON.parse(e.data));
      else drawing = drawing.then(() => draw(e.data)).catch(() => {});
    };
    socket.onclose = () => { show('Disconnected: reconnecting…'); setTimeout(connect, 1000); };
    socket.onerror = () => socket.close();
  };

  sendSize();
  connect();
})();
</script>
</body>
</html>
