name: build

# Feature branches are covered by their pull request, so push only fires on the
# trunk: a branch with an open PR would otherwise run the whole workflow twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: "Which target to build"
        type: choice
        default: linux-x64
        options: [linux-x64, linux-arm64, win-x64, win-arm64, osx-x64, osx-arm64, all]
      cross_platform_tests:
        description: "Also run the tests on Windows and macOS (slow: bills at 2x and 10x)"
        type: boolean
        default: false
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  # Windows and macOS runners bill at 2x and 10x Linux, roughly 36 billed minutes
  # a go, so they are not worth spending on every push. They exist to prove the app
  # still runs on those platforms: trunk, a release, or a manual run that asks.
  # Publishing a build to try out should not drag them along.
  test-all-os:
    name: test (${{ matrix.os }})
    if: github.event_name == 'push' || github.event_name == 'release' || inputs.cross_platform_tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  # Every target cross-compiles from Linux: a self-contained publish only needs
  # the matching runtime pack from NuGet, and the .app bundle is assembled with
  # mkdir/sed/mv. See build/publish.sh. Signing would need a Mac; these builds
  # are deliberately unsigned.
  publish:
    name: publish (${{ github.event_name == 'release' && 'all' || inputs.target }})
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-publish-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-publish-

      # A release always ships every target. A manual run defaults to one, because
      # iterating on all six costs 233 MB of a 500 MB artifact quota per run.
      - name: Publish
        run: ./build/publish.sh "${{ github.event_name == 'release' && 'all' || inputs.target }}"

      # Manual runs keep their output as an artifact, briefly: it is a build to go
      # and try, not something to hold for a fortnight.
      - name: Upload build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: VideoMetadataFiller-${{ inputs.target }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 3

      # Release binaries go onto the release itself. Release assets do not count
      # against the artifact quota, they never expire, and unlike a CI artifact the
      # archives keep their executable bit, so the macOS .app stays launchable.
      - name: Package release archives
        if: github.event_name == 'release'
        run: ./build/package.sh

      - name: Attach archives to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
