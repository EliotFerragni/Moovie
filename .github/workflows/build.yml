name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  publish:
    name: publish ${{ matrix.runtime }}
    needs: test
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runtime: win-x64,     host: windows-latest }
          - { runtime: win-arm64,   host: windows-latest }
          - { runtime: osx-x64,     host: macos-latest }
          - { runtime: osx-arm64,   host: macos-latest }
          - { runtime: linux-x64,   host: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # The shell script also assembles the macOS .app bundle, which a bare
      # dotnet publish does not produce.
      - name: Publish
        shell: bash
        run: ./build/publish.sh ${{ matrix.runtime }}

      - uses: actions/upload-artifact@v4
        with:
          name: VideoMetadataFiller-${{ matrix.runtime }}
          path: artifacts/${{ matrix.runtime }}
          if-no-files-found: error
